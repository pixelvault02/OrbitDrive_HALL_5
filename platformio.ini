; OrbitDrive_HALL_5 — STM32G431 + SimpleFOC + analog halls
; Control from OrbitDrive3.0; hall sensing + boot home from HALL_2.

[platformio]
default_envs = stm32_g431

[env]
platform = ststm32
framework = arduino
monitor_speed = 115200
lib_archive = false
lib_deps =
	askuric/Simple FOC@^2.3.4
	khoih-prog/FlashStorage_STM32@^1.2.0
	https://github.com/duckylotl/STM32_CAN.git#FDCAN
; FlashStorage_STM32 bundles the eeprom_* helpers; ignore the core EEPROM
; library to avoid "multiple definition" linker errors.
lib_ignore =
	EEPROM

[env:stm32_g431]
board = genericSTM32G431CB
upload_protocol = stlink
debug_tool = stlink
build_flags =
	-D HAL_FDCAN_MODULE_ENABLED
	-D SERIAL_UART_INSTANCE=1
	-D PIN_SERIAL_TX=PB6
	-D PIN_SERIAL_RX=PB7
	-D SIMPLEFOC_STM32_DEBUG
